# =============================================================================
#  TEMPLATE SERVER BLOCK NGINX - HACKATHON DEVOPS FUNDAMENTALS
# -----------------------------------------------------------------------------
#  Hướng dẫn:
#   1. Copy file này vào repository:  nginx/<TEN_TAI_KHOAN>.conf
#   2. Thay TOÀN BỘ các giá trị <...> theo "Bảng thông số của đề".
#      Không được để sót bất kỳ dấu < > nào.
#   3. Copy sang /etc/nginx/sites-available/<TEN_TAI_KHOAN>.conf,
#      tạo symlink sang /etc/nginx/sites-enabled/,
#      kiểm tra:   sudo nginx -t
#      áp dụng:    sudo systemctl reload nginx
#
#  Ví dụ (Đề 2, sinh viên Nguyễn Văn An - lớp K24CNTT1):
#   <PORT>            -> 8080 (Lưu ý: không được trùng các bạn khác trong nhóm, nếu trùng tự đổi)
#   <SERVER_NAME>     -> 203.0.113.10 (IP của máy chủ, xem bằng lệnh: hostname -I)
#   <WEB_ROOT>        -> /var/www/devops-hackathon-de002/src
#   <INDEX_FILE>      -> index.html
#   <TEN_TAI_KHOAN>   -> nvan-k24cntt1
#   <ALLOW_DIRECTIVE> -> allow all  (cho phép MỌI request từ bên ngoài truy cập,
#                                     tương đương "Require all granted" của Apache)
# =============================================================================

server {
    listen      8080;
    listen      [::]:8080;

    server_name <SERVER_NAME>;

    root        <WEB_ROOT>;
    index       <INDEX_FILE>;

    access_log  /var/log/nginx/<TEN_TAI_KHOAN>.access.log;
    error_log   /var/log/nginx/<TEN_TAI_KHOAN>.error.log;

    location / {
        <ALLOW_DIRECTIVE>;
        try_files $uri $uri/ =404;
    }
}
